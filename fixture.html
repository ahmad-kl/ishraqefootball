<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixtures - Ishraq PES</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            background-color: #05010a;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: url('https://res.cloudinary.com/dsfycdl5o/image/upload/v1795253975/Neon_Purple_Stadium_Glow_quidcw.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: transparent;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            position: relative;
            width: 32px;
            height: 40px;
            border: 2.5px solid white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
        }

        .logo-icon .ball {
            width: 16px;
            height: 16px;
            border: 1.5px solid white;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon .ball::after {
            content: '';
            width: 6px;
            height: 6px;
            border: 1.5px solid white;
            transform: rotate(45deg);
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.1;
        }

        .logo-text p {
            font-size: 12px;
            color: #d1d5db;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bell-icon {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .red-dot {
            position: absolute;
            top: -2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #d946ef;
            border-radius: 50%;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .hero-banner {
            width: 100%;
            height: 160px;
            background: linear-gradient(to bottom, rgba(59, 7, 100, 0.4) 0%, #05010a 100%);
            border-top: 1px solid #581c87;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        .hero-banner .cal-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4c1d95, #a855f7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
            border: 1px solid #d8b4fe;
        }

        .hero-banner .title-text h1 {
            font-size: 38px;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-banner .title-text h1 span {
            color: #d946ef;
        }

        .hero-banner .title-text p {
            font-size: 14px;
            color: #e5e7eb;
            margin-top: 5px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            color: white;
            background: rgba(5, 1, 10, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid #581c87;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #7e22ce, #c026d3);
            border-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .tab-btn svg {
            width: 18px;
            height: 18px;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
            padding-bottom: 40px;
        }

        .match-card {
            background: rgba(20, 5, 30, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid #7e22ce;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(126, 34, 206, 0.3), inset 0 0 10px rgba(126, 34, 206, 0.1);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed rgba(168, 85, 247, 0.3);
        }

        .date-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(126, 34, 206, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .time-text {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #d1d5db;
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team-box {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 40%;
        }

        .team-box.right {
            justify-content: flex-end;
            text-align: right;
        }

        .team-logo {
            width: 35px;
            height: 40px;
            background: #1f2937;
            border: 2px solid #9ca3af;
            border-radius: 4px 4px 15px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .team-logo-img {
            width: 35px;
            height: 35px;
            flex: 0 0 35px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            background: #1f1230;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.35);
        }

        .logo-gold { border-color: #eab308; color: #eab308; }
        .logo-blue { border-color: #3b82f6; color: #3b82f6; background: #172554; }
        .logo-silver { border-color: #e5e7eb; color: #e5e7eb; background: #374151; }
        .logo-dark { border-color: #6b7280; color: #6b7280; background: #111827; }

        .team-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vs-text {
            font-size: 20px;
            font-weight: 800;
            font-style: italic;
            color: #d946ef;
            text-shadow: 0 0 10px rgba(217, 70, 239, 0.5);
            text-align: center;
            min-width: 60px;
        }

        .loading-text {
            text-align: center;
            color: #d8b4fe;
            padding: 30px;
            font-size: 14px;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="app-container">

    <header>
        <div class="header-left">

            <a href="ongoing.html" class="back-btn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>

            <div class="logo-box">
                <div class="logo-icon">
                    <div class="ball"></div>
                </div>
                <div class="logo-text">
                    <h1>Ishraq PES</h1>
                    <p>Tournament</p>
                </div>
            </div>
        </div>

        <div class="header-right">
            <div class="bell-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="red-dot"></span>
            </div>

            <button class="menu-btn">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <div class="hero-banner">
        <div class="cal-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </div>

        <div class="title-text">
            <h1>Fi<span>xtures</span></h1>
            <p>Tournament Matches</p>
        </div>
    </div>

    <div class="filter-tabs">

        <button class="tab-btn active" data-filter="all">
            All Matches
        </button>

        <button class="tab-btn" data-filter="league">
            Group Stage
        </button>

        <button class="tab-btn" data-filter="playoff">
            Knockout
        </button>

    </div>

    <div class="match-list" id="matchList">
        <div class="loading-text">Loading matches...</div>
    </div>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
    import { refs, onSnapshot } from "./firebase.js";

    const matchList = document.getElementById("matchList");

    let matches = [];
    let players = {};
    let currentFilter = "all";

    // Live player updates from Firestore
    onSnapshot(refs.players, snap => {

        players = {};

        snap.docs.forEach(d => {
            players[d.id] = d.data();
        });

        render();

    }, error => {

        console.error("Players listener error:", error);

        matchList.innerHTML = `
            <div class="loading-text">
                Unable to load players. Check Firebase settings.
            </div>
        `;

    });

    // Live fixture and result updates from Firestore
    onSnapshot(refs.matches, snap => {

        matches = snap.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        render();

    }, error => {

        console.error("Matches listener error:", error);

        matchList.innerHTML = `
            <div class="loading-text">
                Unable to load matches. Check Firebase settings.
            </div>
        `;

    });

    // Filter buttons
    document.querySelectorAll(".tab-btn").forEach(btn => {

        btn.addEventListener("click", () => {

            document.querySelectorAll(".tab-btn").forEach(b => {
                b.classList.remove("active");
            });

            btn.classList.add("active");

            currentFilter = btn.dataset.filter;

            render();

        });

    });

    // Prevent player names from being interpreted as HTML
    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);

    }

    // Get player logo
    function getPlayerLogo(playerId) {

        const player = players[playerId];

        if (!player) {
            return "https://ui-avatars.com/api/?name=TBD&background=4c1d95&color=fff";
        }

        return player.logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(player.name || "Player")}&background=4c1d95&color=fff`;

    }

    // Render matches
    function render() {

        if (!matches.length) {

            matchList.innerHTML = `
                <div class="loading-text">
                    No matches generated yet.
                </div>
            `;

            return;
        }

        let list = [...matches];

        if (currentFilter === "league") {
            list = list.filter(m => m.stage === "league");
        }

        if (currentFilter === "playoff") {
            list = list.filter(m => m.stage !== "league");
        }

        list.sort((a, b) => {

            if (a.stage === "league" && b.stage === "league") {
                return (a.round || 0) - (b.round || 0);
            }

            return 0;

        });

        if (!list.length) {

            matchList.innerHTML = `
                <div class="loading-text">
                    No matches found for this category.
                </div>
            `;

            return;
        }

        matchList.innerHTML = list.map(m => {

            const homeName = players[m.home]?.name || "TBD";
            const awayName = players[m.away]?.name || "TBD";

            const homeLogo = getPlayerLogo(m.home);
            const awayLogo = getPlayerLogo(m.away);

            const stageLabel =
                m.stage === "league" ? `Round ${m.round}` :
                m.stage === "semi" ? "Semi Final" :
                "Final";

            const scoreDisplay = m.played
                ? `<span style="color:#d946ef;">${m.hg} - ${m.ag}</span>`
                : "VS";

            return `
                <div class="match-card">

                    <div class="card-top">

                        <div class="date-badge">
                            ${escapeHTML(stageLabel)}
                        </div>

                        <div class="time-text">
                            ${m.played ? "Completed" : "Pending"}
                        </div>

                    </div>

                    <div class="card-main">

                        <div class="team-box">

                            <img
                                class="team-logo-img"
                                src="${escapeHTML(homeLogo)}"
                                alt="${escapeHTML(homeName)} logo"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=Player&background=4c1d95&color=fff';"
                            >

                            <span class="team-name">
                                ${escapeHTML(homeName)}
                            </span>

                        </div>

                        <div class="vs-text">
                            ${scoreDisplay}
                        </div>

                        <div class="team-box right">

                            <span class="team-name">
                                ${escapeHTML(awayName)}
                            </span>

                            <img
                                class="team-logo-img"
                                src="${escapeHTML(awayLogo)}"
                                alt="${escapeHTML(awayName)} logo"
                                loading="lazy"
                                onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=Player&background=4c1d95&color=fff';"
                            >

                        </div>

                    </div>

                </div>
            `;

        }).join("");

    }

</script>

</body>
</html>
