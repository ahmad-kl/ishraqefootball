<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishraq PES - Admin Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0715;color:white;font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto;padding:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#42166a,#0c0715 65%)}
.login-box{width:100%;max-width:370px;background:#1b102b;border:1px solid #7841ad;border-radius:18px;padding:28px;text-align:center}
.login-box h1{color:#e3c5ff;font-size:23px;margin:12px 0}
.login-box p{color:#b69dce;font-size:12px;margin-bottom:20px}
.field{width:100%;padding:12px;background:#10091b;border:1px solid #583477;border-radius:8px;color:white;margin:7px 0;outline:none}
.field:focus{border-color:#c18aff}
.btn{padding:11px 15px;border:0;border-radius:8px;background:#843bd0;color:white;font-weight:bold}
.btn.secondary{background:#352044;border:1px solid #71439a}
.btn.danger{background:#552039;color:#ffb2c4}
.btn.green{background:#176347}
.btn.small{padding:7px 10px;font-size:11px}
.login-box .btn{width:100%;margin-top:8px}
.error{color:#ff9db2;font-size:12px;margin-top:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 20px;border-bottom:1px solid #39234d;margin-bottom:20px}
header h1{font-size:20px;color:#e5caff}
header p{font-size:11px;color:#a991bd;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat,.panel,.nav button{background:#1d122b;border:1px solid #50306d;border-radius:12px}
.stat{padding:15px}
.stat small{display:block;color:#ae98c4;font-size:11px}
.stat strong{display:block;color:#d9adff;font-size:24px;margin-top:8px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.nav button{padding:10px 13px;color:#d9c6ed;font-size:12px}
.nav button.active{background:#472267;border-color:#c08aff;color:white}
.panel{padding:18px;margin-bottom:15px}
.panel h2{font-size:18px;color:#e4c8ff;margin-bottom:7px}
.muted{font-size:12px;color:#ad98c1;line-height:1.6;margin-bottom:15px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row .field{flex:1;min-width:120px}
.list{display:grid;gap:9px;margin-top:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:#120b1c;border:1px solid #38234d;border-radius:9px}
.item strong{font-size:13px}
.item small{display:block;color:#a991bd;font-size:11px;margin-top:5px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#392052;color:#dfc0ff;font-size:10px}
.match{padding:13px;background:#120b1c;border:1px solid #39234d;border-radius:10px;margin-top:10px}
.match-head{display:flex;justify-content:space-between;gap:8px;color:#bda5d3;font-size:11px;margin-bottom:10px}
.scoreline{display:grid;grid-template-columns:1fr 55px 15px 55px 1fr;gap:6px;align-items:center;text-align:center}
.scoreline .name{font-size:12px;overflow-wrap:anywhere; display:flex; align-items:center; justify-content:center; gap:5px;}
.scoreline input{width:100%;text-align:center;padding:9px 3px;background:#211331;border:1px solid #67408b;border-radius:7px;color:white}
.scoreline .vs{color:#a68bbd;font-size:11px}
.match-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:11px 9px;text-align:center;border-bottom:1px solid #39234d}
th{color:#c9a9e9;background:#241535}
td:first-child,th:first-child{text-align:left}
.section-title{font-size:14px;color:#e2c5ff;margin:18px 0 10px}
.notice{background:#2b1b3b;border:1px solid #69448a;padding:12px;border-radius:9px;font-size:12px;line-height:1.6;color:#ddc8f0;margin-bottom:13px}
.empty{color:#a991bd;font-size:12px;padding:18px;text-align:center}
label{display:block;color:#c5afd9;font-size:11px;margin:10px 0 4px}
textarea.field{resize:vertical}
.footer{text-align:center;color:#766187;font-size:11px;padding:20px 0}
.avatar-img{width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid #583477;}
@media(max-width:650px){.app{padding:13px}.stats{grid-template-columns:1fr 1fr}.scoreline{grid-template-columns:minmax(0,1fr) 43px 12px 43px minmax(0,1fr)}.scoreline .name{font-size:10px}}
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <div class="login-box">
    <div style="font-size:42px">🔐</div>
    <h1>ISHRAQ ADMIN</h1>
    <p>Tournament Control Center</p>
    <form id="loginForm">
      <input class="field" id="email" type="email" placeholder="Admin Email" required>
      <input class="field" id="password" type="password" placeholder="Password" required>
      <button class="btn" type="submit">LOGIN</button>
    </form>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="app hidden" id="adminApp">
<header>
  <div>
    <h1>🏆 ISHRAQ PES ADMIN</h1>
    <p id="adminEmail">—</p>
  </div>
  <button class="btn danger small" id="logout">Logout</button>
</header>

<div class="stats">
  <div class="stat"><small>Players</small><strong id="sPlayers">0</strong></div>
  <div class="stat"><small>League Matches</small><strong id="sMatches">0/0</strong></div>
  <div class="stat"><small>Completed</small><strong id="sCompleted">0</strong></div>
  <div class="stat"><small>Rounds</small><strong id="sRounds">0</strong></div>
</div>

<div class="nav" id="navigation">
  <button class="active" data-tab="overview">Overview</button>
  <button data-tab="players">Players</button>
  <button data-tab="fixtures">Fixtures</button>
  <button data-tab="table">Points Table</button>
  <button data-tab="playoffs">Semi & Final</button>
  <button data-tab="stats">Player Stats</button>
  <button data-tab="gk">Best GK</button>
  <button data-tab="awards">Awards</button>
  <button data-tab="settings">Info</button>
</div>

<div id="content"></div>
<div class="footer">ISHRAQ PES TOURNAMENT • ADMIN PANEL</div>
</div>

<script type="module">
import {
  auth, refs,
  signInWithEmailAndPassword, signOut, onAuthStateChanged,
  doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp
} from "./firebase.js";

let players = [];
let matches = [];
let info = {};
let awards = {};
let currentTab = "overview";
let attached = false;

/* ---------- HELPER: DEFAULT AVATAR ---------- */
const getAvatar = (name, logo) => logo || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4c1d95&color=fff`;

/* ---------- AUTH ---------- */
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("adminApp").classList.remove("hidden");
    document.getElementById("adminEmail").textContent = user.email;
    attachListeners();
    render();
  } else {
    document.getElementById("adminApp").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
  }
});

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  document.getElementById("loginError").textContent = "";
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );
  } catch (err) {
    document.getElementById("loginError").textContent = err.message;
  }
});

document.getElementById("logout").onclick = () => signOut(auth);

/* ---------- NAV ---------- */
window.goTab = (t) => {
  currentTab = t;
  document.querySelectorAll("#navigation button").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === t)
  );
  render();
};
document.getElementById("navigation").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) goTab(b.dataset.tab);
});

/* ---------- LISTENERS ---------- */
function attachListeners() {
  if (attached) return;
  attached = true;
  onSnapshot(refs.players, snap => {
    players = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(); updateStats();
  });
  onSnapshot(refs.matches, snap => {
    matches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(); updateStats();
  });
  onSnapshot(refs.tournament, snap => {
    info = snap.exists() ? snap.data() : {};
    render();
  });
  onSnapshot(refs.awards, snap => {
    awards = snap.exists() ? snap.data() : {};
    render();
  });
}

/* ---------- HELPERS ---------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const pName = id => players.find(p => p.id === id)?.name || "Removed";
const pLogo = id => {
  const p = players.find(p => p.id === id);
  return p ? getAvatar(p.name, p.logo) : getAvatar("TBD");
};

const leagueMatches = () => matches.filter(m => m.stage === "league");
const playedLeague  = () => leagueMatches().filter(m => m.played);
const totalRounds = () => players.length < 2 ? 0
  : (players.length % 2 === 0 ? players.length - 1 : players.length);

function updateStats() {
  document.getElementById("sPlayers").textContent = players.length;
  document.getElementById("sMatches").textContent =
    playedLeague().length + "/" + leagueMatches().length;
  document.getElementById("sCompleted").textContent = playedLeague().length;
  document.getElementById("sRounds").textContent = totalRounds();
}

function calculateTable() {
  const rows = players.map(p => ({
    id:p.id, name:p.name, logo:p.logo, played:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0
  }));
  const byId = Object.fromEntries(rows.map(r => [r.id, r]));
  playedLeague().forEach(m => {
    const h = byId[m.home], a = byId[m.away];
    if (!h || !a) return;
    h.played++; a.played++;
    h.gf += m.hg; h.ga += m.ag;
    a.gf += m.ag; a.ga += m.hg;
    if (m.hg > m.ag) { h.w++; h.pts += 3; a.l++; }
    else if (m.hg < m.ag) { a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });
  rows.forEach(r => r.gd = r.gf - r.ga);
  rows.sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.name.localeCompare(b.name));
  return rows;
}

const leagueComplete = () =>
  leagueMatches().length > 0 && leagueMatches().every(m => m.played);

function winnerOf(m) {
  if (!m || !m.played) return null;
  if (m.hg > m.ag) return m.home;
  if (m.ag > m.hg) return m.away;
  return m.winner || null;
}

async function clearAllMatches() {
  for (const m of matches) {
    await deleteDoc(doc(refs.matches, m.id)).catch(() => {});
  }
  await setDoc(refs.tournament, { generated: false }, { merge: true });
}

/* ---------- RENDER ---------- */
function render() {
  const map = {
    overview: overviewHTML, players: playersHTML, fixtures: fixturesHTML,
    table: tableHTML, playoffs: playoffsHTML, stats: statsHTML, 
    gk: gkHTML, awards: awardsHTML, settings: settingsHTML
  };
  document.getElementById("content").innerHTML = (map[currentTab] || overviewHTML)();
}

/* OVERVIEW */
function overviewHTML() {
  const done = playedLeague().length;
  const total = leagueMatches().length;
  const rows = calculateTable();
  return `
  <div class="panel">
    <h2>Welcome, Admin!</h2>
    <p class="muted">Manage league + playoffs. All data is synced live.</p>
    <div class="notice">
      Single Round Robin • ${players.length} players<br>
      ${total} fixtures • ${totalRounds()} rounds<br>
      Top 4 → semi-finals when ≥4 players.
    </div>
    <div class="row">
      <button class="btn" onclick="goTab('players')">Manage Players</button>
      <button class="btn secondary" onclick="goTab('fixtures')">Fixtures</button>
      <button class="btn secondary" onclick="goTab('table')">Points Table</button>
    </div>
  </div>
  <div class="panel">
    <h2>League Progress</h2>
    <p class="muted">${done} of ${total} completed.</p>
    <div style="height:9px;background:#352044;border-radius:20px;overflow:hidden">
      <div style="height:100%;width:${total ? done/total*100 : 0}%;background:#a75aff"></div>
    </div>
    <h3 class="section-title">Current Top 4</h3>
    ${rows.length ? rows.slice(0,4).map((r,i) => `
      <div class="item">
        <div style="display:flex; align-items:center; gap:10px;">
          <img src="${getAvatar(r.name, r.logo)}" class="avatar-img">
          <div>
            <strong>${i+1}. ${esc(r.name)}</strong>
            <small>${r.pts} pts • ${r.played} played</small>
          </div>
        </div>
        <span class="badge">Rank ${i+1}</span>
      </div>`).join("") : `<div class="empty">No players yet.</div>`}
  </div>`;
}

/* PLAYERS */
function playersHTML() {
  return `
  <div class="panel">
    <h2>Players</h2>
    <p class="muted">Minimum 2 players required to generate fixtures. You can add an optional Logo URL.</p>
    <div class="row">
      <input class="field" id="newPlayer" placeholder="Player Name" maxlength="30">
      <input class="field" id="newPlayerLogo" placeholder="Logo Image URL (Optional)">
      <button class="btn" onclick="addPlayer()">Add Player</button>
    </div>
    <div class="list">
      ${players.length ? players.map(p => `
        <div class="item">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${getAvatar(p.name, p.logo)}" class="avatar-img">
            <div>
              <strong>${esc(p.name)}</strong>
              <small>Saves ${p.saves||0} • Assists ${p.assists||0} • MOTM ${p.motm||0}</small>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn secondary small" onclick="editLogo('${p.id}')">Logo</button>
            <button class="btn secondary small" onclick="renamePlayer('${p.id}')">Rename</button>
            <button class="btn danger small" onclick="removePlayer('${p.id}')">Remove</button>
          </div>
        </div>`).join("") : `<div class="empty">No players yet.</div>`}
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn green" onclick="generateLeague()">
        ${info.generated ? "Regenerate" : "Generate"} League Fixtures
      </button>
    </div>
  </div>`;
}

window.addPlayer = async () => {
  const input = document.getElementById("newPlayer");
  const logoInput = document.getElementById("newPlayerLogo");
  const name = input.value.trim();
  const logo = logoInput.value.trim();
  
  if (!name) return;
  if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    alert("Player already exists"); return;
  }
  if (info.generated && !confirm("This resets all fixtures & results. Continue?")) return;
  if (info.generated) await clearAllMatches();
  
  await addDoc(refs.players, {
    name, logo: logo || null, saves: 0, assists: 0, motm: 0, createdAt: serverTimestamp()
  });
  input.value = "";
  logoInput.value = "";
};

window.editLogo = async (id) => {
  const p = players.find(x => x.id === id); if (!p) return;
  const logo = prompt("Enter Logo Image URL:", p.logo || "");
  if (logo === null) return; // Canceled
  await updateDoc(doc(refs.players, id), { logo: logo.trim() || null });
};

window.renamePlayer = async (id) => {
  const p = players.find(x => x.id === id); if (!p) return;
  const name = prompt("New name:", p.name);
  if (!name || !name.trim()) return;
  if (info.generated && !confirm("This resets fixtures. Continue?")) return;
  if (info.generated) await clearAllMatches();
  await updateDoc(doc(refs.players, id), { name: name.trim() });
};

window.removePlayer = async (id) => {
  if (!confirm("Remove this player?")) return;
  if (info.generated && !confirm("This resets fixtures. Continue?")) return;
  if (info.generated) await clearAllMatches();
  await deleteDoc(doc(refs.players, id));
};

window.generateLeague = async () => {
  if (players.length < 2) { alert("Add at least 2 players"); return; }
  if (info.generated && !confirm("Regenerate? All results will be lost.")) return;
  await clearAllMatches();

  const pool = players.map(p => p.id);
  if (pool.length % 2) pool.push(null);
  const n = pool.length, rounds = n - 1, perRound = n / 2;
  const list = [];
  for (let r = 0; r < rounds; r++) {
    for (let i = 0; i < perRound; i++) {
      const home = pool[i], away = pool[n - 1 - i];
      if (home && away) {
        list.push({
          stage: "league", round: r + 1, home, away,
          hg: null, ag: null, played: false, winner: null
        });
      }
    }
    pool.splice(1, 0, pool.pop());
  }
  for (const m of list) await addDoc(refs.matches, m);
  await setDoc(refs.tournament, { generated: true, updatedAt: serverTimestamp() }, { merge: true });
  alert(list.length + " fixtures generated.");
};

/* FIXTURES */
function matchCard(m) {
  const tied = m.played && m.hg === m.ag && m.stage !== "league";
  return `
  <div class="match">
    <div class="match-head">
      <span>${m.stage === "league" ? "ROUND " + m.round : m.stage.toUpperCase()}</span>
      <span class="badge">${m.played ? "COMPLETED" : "PENDING"}</span>
    </div>
    <div class="scoreline">
      <div class="name">
        <img src="${pLogo(m.home)}" class="avatar-img" style="width:20px;height:20px;"> ${esc(pName(m.home))}
      </div>
      <input type="number" min="0" id="hg-${m.id}" value="${m.hg ?? ""}" placeholder="-">
      <span class="vs">VS</span>
      <input type="number" min="0" id="ag-${m.id}" value="${m.ag ?? ""}" placeholder="-">
      <div class="name">
        ${esc(pName(m.away))} <img src="${pLogo(m.away)}" class="avatar-img" style="width:20px;height:20px;">
      </div>
    </div>
    ${tied ? `
      <label>Winner after tie-break</label>
      <select class="field" id="winner-${m.id}">
        <option value="">Select winner</option>
        <option value="${m.home}" ${m.winner === m.home ? "selected" : ""}>${esc(pName(m.home))}</option>
        <option value="${m.away}" ${m.winner === m.away ? "selected" : ""}>${esc(pName(m.away))}</option>
      </select>` : ""}
    <div class="match-actions">
      <button class="btn small" onclick="saveResult('${m.id}')">Save</button>
      <button class="btn danger small" onclick="clearResult('${m.id}')">Clear</button>
    </div>
  </div>`;
}

function fixturesHTML() {
  const lm = leagueMatches().sort((a,b) => a.round - b.round);
  const groups = {};
  lm.forEach(m => (groups[m.round] ||= []).push(m));
  return `
  <div class="panel">
    <h2>League Fixtures</h2>
    <p class="muted">${lm.length} matches • ${Object.keys(groups).length} rounds</p>
    ${lm.length ? Object.entries(groups).map(([r, ms]) =>
      `<h3 class="section-title">Round ${r}</h3>${ms.map(matchCard).join("")}`).join("")
      : `<div class="empty">Generate fixtures first.</div>`}
  </div>`;
}

window.saveResult = async (id) => {
  const m = matches.find(x => x.id === id); if (!m) return;
  const hg = Number(document.getElementById("hg-" + id).value);
  const ag = Number(document.getElementById("ag-" + id).value);
  if (!Number.isInteger(hg) || !Number.isInteger(ag) || hg < 0 || ag < 0) {
    alert("Enter valid scores"); return;
  }
  let winner = null;
  if (m.stage !== "league" && hg === ag) {
    winner = document.getElementById("winner-" + id)?.value;
    if (winner !== m.home && winner !== m.away) {
      alert("Select a winner for the tie-break"); return;
    }
  }
  await updateDoc(doc(refs.matches, id), { hg, ag, played: true, winner });
  if (id === "semi1" || id === "semi2") {
    await deleteDoc(doc(refs.matches, "final")).catch(() => {});
  }
};

window.clearResult = async (id) => {
  if (!confirm("Clear this result?")) return;
  await updateDoc(doc(refs.matches, id), {
    hg: null, ag: null, played: false, winner: null
  });
  if (id === "semi1" || id === "semi2") {
    await deleteDoc(doc(refs.matches, "final")).catch(() => {});
  }
};

/* TABLE */
function tableHTML() {
  const rows = calculateTable();
  return `
  <div class="panel">
    <h2>Points Table</h2>
    ${rows.length ? `
      <div class="table-wrap" style="overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
          <tbody>
            ${rows.map((r,i) => `
              <tr>
                <td>${i+1}</td>
                <td class="${i<4?'top4':''}" style="display:flex; align-items:center; gap:8px; text-align:left;">
                  <img src="${getAvatar(r.name, r.logo)}" class="avatar-img" style="width:20px;height:20px;">
                  ${esc(r.name)}
                </td>
                <td>${r.played}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
                <td>${r.gf}</td><td>${r.ga}</td><td>${r.gd}</td>
                <td><strong>${r.pts}</strong></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <p class="muted" style="margin-top:14px">Top 4 (green) qualify for semi-finals.</p>
    ` : `<div class="empty">No data yet.</div>`}
  </div>`;
}

/* PLAYOFFS */
function playoffsHTML() {
  const s1 = matches.find(m => m.id === "semi1");
  const s2 = matches.find(m => m.id === "semi2");
  const fn = matches.find(m => m.id === "final");
  return `
  <div class="panel">
    <h2>Semi-Finals & Final</h2>
    <p class="muted">Complete all league matches first (Top 4 qualify).</p>
    <div class="row">
      <button class="btn green" onclick="generateSemis()">Generate Semi-Finals</button>
      <button class="btn green" onclick="generateFinal()">Generate Final</button>
    </div>
    <h3 class="section-title">Semi-Final 1</h3>
    ${s1 ? matchCard(s1) : `<div class="empty">Not generated.</div>`}
    <h3 class="section-title">Semi-Final 2</h3>
    ${s2 ? matchCard(s2) : `<div class="empty">Not generated.</div>`}
    <h3 class="section-title">Final</h3>
    ${fn ? matchCard(fn) : `<div class="empty">Not generated.</div>`}
  </div>`;
}

window.generateSemis = async () => {
  if (!leagueComplete()) { alert("Complete all league matches first."); return; }
  if (players.length < 4) { alert("At least 4 players required."); return; }
  if (!confirm("Generate semi-finals from Top 4? Existing semis/final will be cleared.")) return;
  const top = calculateTable().slice(0, 4);
  for (const id of ["semi1", "semi2", "final"]) {
    await deleteDoc(doc(refs.matches, id)).catch(() => {});
  }
  await setDoc(doc(refs.matches, "semi1"), {
    stage: "semi", round: 1, home: top[0].id, away: top[3].id,
    hg: null, ag: null, played: false, winner: null
  });
  await setDoc(doc(refs.matches, "semi2"), {
    stage: "semi", round: 1, home: top[1].id, away: top[2].id,
    hg: null, ag: null, played: false, winner: null
  });
};

window.generateFinal = async () => {
  const w1 = winnerOf(matches.find(m => m.id === "semi1"));
  const w2 = winnerOf(matches.find(m => m.id === "semi2"));
  if (!w1 || !w2) { alert("Complete both semis + tie-breaks."); return; }
  if (!confirm("Generate final?")) return;
  await setDoc(doc(refs.matches, "final"), {
    stage: "final", round: 1, home: w1, away: w2,
    hg: null, ag: null, played: false, winner: null
  });
};

/* PLAYER STATS (Goals, Assists, MOTM) */
function computeStats(playerId) {
  const s = { goals: 0, cleanSheets: 0, conceded: 0, w: 0, d: 0, l: 0 };
  playedLeague().forEach(m => {
    if (m.home === playerId) {
      s.goals += m.hg;
      s.conceded += m.ag;
      if (m.ag === 0) s.cleanSheets++;
      if (m.hg > m.ag) s.w++; else if (m.hg < m.ag) s.l++; else s.d++;
    } else if (m.away === playerId) {
      s.goals += m.ag;
      s.conceded += m.hg;
      if (m.hg === 0) s.cleanSheets++;
      if (m.ag > m.hg) s.w++; else if (m.ag < m.hg) s.l++; else s.d++;
    }
  });
  return s;
}

function statsHTML() {
  return `
  <div class="panel">
    <h2>Player Stats</h2>
    <p class="muted">Goals & W-D-L auto-computed. Assists / MOTM admin-entered.</p>
    <div class="list">
      ${players.length ? players.map(p => {
        const s = computeStats(p.id);
        return `
        <div class="item" style="flex-direction:column;align-items:stretch">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${getAvatar(p.name, p.logo)}" class="avatar-img">
            <div>
              <strong>${esc(p.name)}</strong>
              <small>Goals ${s.goals} • W-D-L ${s.w}-${s.d}-${s.l}</small>
            </div>
          </div>
          <div class="row" style="margin-top:8px">
            <input class="field" type="number" min="0" id="assists-${p.id}" value="${p.assists||0}" placeholder="Assists">
            <input class="field" type="number" min="0" id="motm-${p.id}" value="${p.motm||0}" placeholder="MOTM">
            <button class="btn small" onclick="saveStats('${p.id}')">Save</button>
          </div>
        </div>`;
      }).join("") : `<div class="empty">No players yet.</div>`}
    </div>
  </div>`;
}

window.saveStats = async (id) => {
  const n = key => Math.max(0, Number(document.getElementById(key + "-" + id).value) || 0);
  await updateDoc(doc(refs.players, id), {
    assists: n("assists"), motm: n("motm")
  });
  alert("Stats updated!");
};

/* BEST GK (പ്രൊഫഷണൽ അഡ്മിൻ ഡാഷ്ബോർഡ്) */
function gkHTML() {
  const opts = (sel) => `
    <option value="">— None —</option>
    ${players.map(p => `<option value="${p.id}" ${sel === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}`;

  const sortedPlayers = [...players].map(p => {
    const s = computeStats(p.id);
    return { ...p, ...s };
  }).sort((a, b) => {
    if (b.cleanSheets !== a.cleanSheets) return b.cleanSheets - a.cleanSheets;
    if (a.conceded !== b.conceded) return a.conceded - b.conceded;
    return a.name.localeCompare(b.name);
  });

  return `
  <div class="panel" style="background: linear-gradient(145deg, #1d122b, #140b1e);">
    <h2 style="display:flex; align-items:center; gap:10px;">🧤 Golden Glove Management</h2>
    <p class="muted">Clean Sheets & Goals Conceded are auto-calculated. Just select the final winner below.</p>
    
    <div style="background: rgba(234, 179, 8, 0.1); border: 1px solid #eab308; padding: 18px; border-radius: 12px; margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between;">
      <div>
        <h3 style="color: #facc15; margin-bottom: 5px; font-size: 16px;">🏆 Select Best GK Winner</h3>
        <small style="color: #d8b4fe;">This will be highlighted on the public Best GK page.</small>
      </div>
      <div class="row" style="flex: 1; min-width: 200px; margin: 0;">
        <select class="field" id="aw-bestGK" style="background: #10091b; border-color: #eab308; margin: 0;">${opts(awards.bestGK)}</select>
        <button class="btn" style="background: #eab308; color: #000; font-weight: 700;" onclick="saveBestGkAward()">Save</button>
      </div>
    </div>

    <h3 class="section-title" style="display:flex; justify-content:space-between;">
      <span>Live Goalkeeper Stats</span>
      <span class="badge" style="background:#392052;">Auto-Calculated</span>
    </h3>
    
    <div class="table-wrap" style="overflow-x:auto; border: 1px solid #39234d; border-radius: 12px;">
      <table style="min-width: 100%;">
        <thead>
          <tr style="background: #241535;">
            <th style="text-align:left; padding: 15px;">Player Name</th>
            <th style="padding: 15px;">Matches</th>
            <th style="padding: 15px; color: #a7ffc8;">Clean Sheets</th>
            <th style="padding: 15px; color: #ffb2c4;">Conceded</th>
          </tr>
        </thead>
        <tbody>
          ${sortedPlayers.length ? sortedPlayers.map(p => {
            const played = p.w + p.d + p.l;
            return `
            <tr style="border-bottom: 1px solid #39234d; transition: background 0.2s;" onmouseover="this.style.background='#241535'" onmouseout="this.style.background='transparent'">
              <td style="text-align:left; padding: 15px; display:flex; align-items:center; gap:8px;">
                <img src="${getAvatar(p.name, p.logo)}" class="avatar-img" style="width:24px; height:24px;">
                <strong style="color: ${awards.bestGK === p.id ? '#facc15' : 'white'};">
                  ${awards.bestGK === p.id ? '👑 ' : ''}${esc(p.name)}
                </strong>
              </td>
              <td style="padding: 15px; color: #c9a9e9;">${played}</td>
              <td style="padding: 15px;">
                <span style="background: rgba(167, 255, 200, 0.1); color: #a7ffc8; padding: 4px 10px; border-radius: 20px; font-weight: bold;">
                  ${p.cleanSheets}
                </span>
              </td>
              <td style="padding: 15px;">
                <span style="background: rgba(255, 178, 196, 0.1); color: #ffb2c4; padding: 4px 10px; border-radius: 20px; font-weight: bold;">
                  ${p.conceded}
                </span>
              </td>
            </tr>`;
          }).join("") : `<tr><td colspan="4" class="empty" style="padding:20px;">No players added yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

window.saveBestGkAward = async () => {

  await setDoc(refs.awards, { bestGK: bestGK, updatedAt: serverTimestamp() }, { merge: true });
  alert("Best GK Winner saved successfully!");
};
