<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongoing Tournament - Ishraq PES</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- അടിസ്ഥാന സ്റ്റൈലുകൾ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px; /* മൊബൈൽ വീഡ്ത്ത് */
            background-color: #05010a;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- ഹെഡർ --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #05010a;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ഫോണിനുള്ളിൽ ബോൾ ഉള്ള ലോഗോ */
        .logo-icon {
            position: relative;
            width: 32px;
            height: 40px;
            border: 2.5px solid white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon::before {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
        }

        .logo-icon .ball {
            width: 16px;
            height: 16px;
            border: 1.5px solid white;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon .ball::after {
            content: '';
            width: 6px;
            height: 6px;
            border: 1.5px solid white;
            transform: rotate(45deg);
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.1;
        }

        .logo-text p {
            font-size: 12px;
            color: #d1d5db;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .bell-icon {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .red-dot {
            position: absolute;
            top: -2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #d946ef; /* പിങ്ക്/പർപ്പിൾ ഡോട്ട് */
            border-radius: 50%;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        /* --- ബാനർ ഇമേജ് --- */
        .hero-banner {
            width: 100%;
            height: 190px;
            background-image: url('https://res.cloudinary.com/dsfycdl5o/image/upload/v1795253495/onl_bhwvhu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-top: 2px solid #581c87;
            border-bottom: 2px solid #581c87;
        }

        /* --- 3x3 ഗ്രിഡ് സെക്ഷൻ --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 15px;
            margin-top: 5px;
        }

        /* ഓരോ ബോക്സിന്റെയും സ്റ്റൈൽ (നിയോൺ ഗ്ലോ) */
        .grid-item {
            background: linear-gradient(180deg, rgba(40, 10, 60, 0.7) 0%, rgba(10, 2, 20, 0.9) 100%);
            border: 1.5px solid #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(168, 85, 247, 0.2);
            border-radius: 12px;
            padding: 12px 5px;
            height: 105px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: transform 0.2s;
        }

        .grid-item:active {
            transform: scale(0.95);
        }

        /* ഐക്കണുകൾക്കുള്ള സ്റ്റൈൽ (ഇമേജുകൾക്ക് വേണ്ടി) */
        .grid-icon-img {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            object-fit: contain;
            /* ഇമേജുകൾ ഇല്ലാത്തതിനാൽ തൽക്കാലം വലിപ്പം മാത്രം നൽകുന്നു */
        }

        /* ഇമേജുകൾ ലോഡ് ആകാത്ത പക്ഷം കാണിക്കാൻ എമോജി / SVG */
        .icon-placeholder {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .grid-item span {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="header-left">
                <!-- Back Button -->
                <a href="index.html" class="back-btn">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                
                <!-- Logo -->
                <div class="logo-box">
                    <!-- Phone with Ball Logo -->
                    <div class="logo-icon">
                        <div class="ball"></div>
                    </div>
                    <div class="logo-text">
                        <h1>Ishraq PES</h1>
                        <p>Tournament</p>
                    </div>
                </div>
            </div>

            <!-- Right Icons -->
            <div class="header-right">
                <!-- Notification Bell -->
                <div class="bell-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="red-dot"></span>
                </div>
                
                <!-- Hamburger Menu -->
                <button class="menu-btn">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Hero Banner -->
        <div class="hero-banner"></div>

        <!-- Menu Grid (3x3) -->
        <div class="menu-grid">
            
            <!-- 1. Fixtures -->
            <a href="fixture.html" class="grid-item">
                <!-- നിങ്ങളുടെ 3D ഐക്കൺ ഇവിടെ ചേർക്കാം: <img src="fixtures.png" class="grid-icon-img"> -->
                <div class="icon-placeholder" style="color: #d8b4fe;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </div>
                <span>Fixtures</span>
            </a>

            <!-- 2. Table -->
            <a href="table.html" class="grid-item">
                <div class="icon-placeholder" style="color: #d8b4fe;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                </div>
                <span>Table</span>
            </a>

            <!-- 3. Top Scorer -->
            <a href="topscorer.html" class="grid-item">
                <div class="icon-placeholder">👟</div>
                <span>Top Scorer</span>
            </a>

            <!-- 4. Best GK -->
            <a href="bestgk.html" class="grid-item">
                <div class="icon-placeholder">🧤</div>
                <span>Best GK</span>
            </a>

            <!-- 5. Golden Ball -->
            <a href="golden-ball.html" class="grid-item">
                <div class="icon-placeholder">⚽</div>
                <span>Golden Ball</span>
            </a>

            <!-- 6. Most Goals Scored -->
            <a href="most-goals-scored.html" class="grid-item">
                <div class="icon-placeholder" style="color: #4ade80;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                </div>
                <span>Most Goals<br>Scored</span>
            </a>

            <!-- 7. Most Goals Conceded -->
            <a href="most-goals-conceded.html" class="grid-item">
                <div class="icon-placeholder" style="color: #ef4444;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                </div>
                <span>Most Goals<br>Conceded</span>
            </a>

            <!-- 8. Teams -->
            <a href="teams.html" class="grid-item">
                <div class="icon-placeholder" style="color: #d8b4fe;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <span>Teams</span>
            </a>

            <!-- 9. Tournament Info -->
            <a href="tournament-info.html" class="grid-item">
                <div class="icon-placeholder" style="color: #d8b4fe;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </div>
                <span>Tournament<br>Info</span>
            </a>

        </div>
    </div>

</body>
</html>
